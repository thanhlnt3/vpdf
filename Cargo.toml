# VPdf (tên tạm) — Cargo workspace.
# Gói gốc ở thư mục này là `vpdf-app` (ứng dụng desktop egui).
# Các crate còn lại nằm trong `crates/` và `tools/`.

[workspace]
resolver = "2"
members = [
    ".",
    "crates/vpdf-core",
    "crates/vpdf-render",
    "crates/vpdf-search",
    "crates/vpdf-ocr",
    "crates/vpdf-sign",
    "crates/vpdf-cli",
    "tools/vpdf-testdata",
    "tools/vpdf-license-check",
]
default-members = [".", "crates/vpdf-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
rust-version = "1.85"

[workspace.dependencies]
vpdf-core = { path = "crates/vpdf-core" }
vpdf-render = { path = "crates/vpdf-render" }
vpdf-search = { path = "crates/vpdf-search" }
vpdf-ocr = { path = "crates/vpdf-ocr" }
vpdf-sign = { path = "crates/vpdf-sign" }
pdfium-render = { version = "0.9.5", default-features = false, features = ["thread_safe", "pdfium_8125"] }
lopdf = { version = "0.47", default-features = false }
libloading = "0.8"
unicode-normalization = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
memory-stats = "1.2"

[package]
name = "vpdf-app"
description = "VPdf — ứng dụng đọc PDF desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "vpdf_app"
path = "src/lib.rs"

[[bin]]
name = "vpdf-app"
path = "src/main.rs"

[dependencies]
vpdf-core.workspace = true
vpdf-render.workspace = true
eframe = { version = "0.36", default-features = false, features = ["wgpu", "accesskit", "links"] }
egui = { version = "0.36", default-features = false }
rfd = { version = "0.18", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
serde.workspace = true
serde_json.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
memory-stats.workspace = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
