# Thành phần KHÔNG phải crate Rust đi kèm bản phát hành (task 1.2, specs/dependency-licensing):
# thư viện native, font, dữ liệu. Kiểm tra bằng: cargo run -p vpdf-license-check
#
# license: biểu thức SPDX ("A OR B" = chọn một; "A AND B" = phải thỏa cả hai).
# License ngoài danh sách cho phép chỉ được chấp nhận khi có mục đã duyệt trong
# third_party/license-exceptions.toml (đủ lý do, người duyệt, ngày duyệt).
# Mục "shipped = false" là công cụ chỉ dùng lúc dựng/kiểm thử, không đi kèm sản phẩm.

[[component]]
name = "PDFium"
version = "chromium/8138 (bblanchon/pdfium-binaries)"
license = "BSD-3-Clause"
source = "https://github.com/bblanchon/pdfium-binaries/releases/tag/chromium/8138"
notice = "third_party/pdfium/win-x64/LICENSE"
shipped = true

